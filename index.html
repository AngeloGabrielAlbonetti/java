<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal OO - Angelo Gabriel</title>
    <style>
        /* --- ESTILOS CSS DO TERMINAL --- */
        body {
            background-color: #0f141c;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }

        #terminal {
            max-width: 950px;
            margin: auto;
            background: #05080c;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
            height: 550px;
            display: flex;
            flex-direction: column;
        }

        #output {
            flex-grow: 1;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-y: auto;
            margin-bottom: 10px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .input-line {
            display: flex;
            align-items: center;
            border-top: 1px solid #1a2333;
            padding-top: 10px;
        }

        .prompt {
            color: #ff00ff;
            margin-right: 8px;
            font-weight: bold;
        }

        #command-input {
            background: transparent;
            border: none;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            outline: none;
            flex-grow: 1;
        }

        .file-link { 
            color: #ffff00; 
            font-weight: bold; 
            cursor: pointer; 
        }

        .file-link:hover { 
            text-decoration: underline; 
        }

        .code-box { 
            background: #151b24; 
            color: #e1e4e8; 
            padding: 15px; 
            border-radius: 4px; 
            margin-top: 8px; 
            border-left: 4px solid #ff00ff; 
            font-size: 0.9rem; 
            overflow-x: auto; 
        }

        .success { color: #00ff66; }
        .error { color: #ff3333; }
        .info { color: #00bfff; }
    </style>
</head>
<body>

<div id="terminal" onclick="document.getElementById('command-input').focus()">
    <div id="output">
        <span class="success">Conectado ao repositório: AngeloGabrielAlbonetti/java</span><br>
        <span class="info">Foco: Estudo de Orientação a Objetos (POO)</span><br><br>
        Digite '<span class="file-link" onclick="executeCommandDirectly('list')">list</span>' para escanear a pasta de exercícios ou '<span class="file-link" onclick="executeCommandDirectly('help')">help</span>' para comandos.<br>
    </div>
    <div class="input-line">
        <span class="prompt">angelo@poo-java:~$</span>
        <input type="text" id="command-input" autofocus autocomplete="off">
    </div>
</div>

<script>
    // --- CONFIGURAÇÕES DO REPOSITÓRIO GITHUB ---
    const REPO_OWNER = 'AngeloGabrielAlbonetti'; 
    const REPO_NAME = 'java';
    const DEFAULT_FOLDER = 'Java_1'; 

    const output = document.getElementById('output');
    const input = document.getElementById('command-input');

    // Monitora a tecla Enter digitada no input
    input.addEventListener('keydown', async function(event) {
        if (event.key === 'Enter') {
            const cmd = input.value.trim();
            if (!cmd) return;
            
            output.innerHTML += `<div><span class="prompt">angelo@poo-java:~$</span> ${escapeHtml(cmd)}</div>`;
            await processCommand(cmd);
            input.value = '';
            output.scrollTop = output.scrollHeight;
        }
    });

    // Processador de Comandos do Terminal
    async function processCommand(cmd) {
        const parts = cmd.split(' ');
        const command = parts[0].toLowerCase(); 
        const arg = parts.slice(1).join(' ');

        if (command === 'help') {
            output.innerHTML += `<div>Comandos do Terminal:<br>  <span class="file-link" onclick="executeCommandDirectly('list')">list</span>          - Lista os exercícios em '${DEFAULT_FOLDER}'<br>  <span class="file-link">read [arquivo]</span> - Abre o código de um arquivo Java<br>  <span class="file-link" onclick="executeCommandDirectly('clear')">clear</span>         - Limpa a tela do terminal</div>`;
        } 
        else if (command === 'clear') {
            output.innerHTML = '';
        } 
        else if (command === 'list') {
            output.innerHTML += `<div class="info">Buscando exercícios na pasta '${DEFAULT_FOLDER}'...</div>`;
            try {
                const url = `https://github.com{REPO_OWNER}/${REPO_NAME}/contents/${DEFAULT_FOLDER}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Não foi possível acessar a pasta no GitHub.');
                
                const files = await response.json();
                const exercicios = files.filter(f => f.name.endsWith('.java') || f.type === 'dir');

                if (exercicios.length === 0) {
                    output.innerHTML += `<div>Nenhum exercício encontrado em '${DEFAULT_FOLDER}'.</div>`;
                    return;
                }

                let listHtml = `<div class="success">Exercícios localizados:</div>`;
                exercicios.forEach(f => {
                    const icon = f.type === 'dir' ? '📁' : '📄';
                    listHtml += `  ${icon} <span class="file-link" onclick="executeRead('${f.name}')">${f.name}</span><br>`;
                });
                output.innerHTML += listHtml;
            } catch (error) {
                output.innerHTML += `<div class="error">Erro: ${error.message}</div>`;
            }
        } 
        else if (command === 'read') {
            if (!arg) {
                output.innerHTML += `<div class="error">Erro: informe o nome do arquivo. Ex: read SeuArquivo.java</div>`;
                return;
            }
            await handleFileRead(arg);
        } 
        else {
            output.innerHTML += `<div class="error">Comando inválido. Digite 'list' para ver as opções.</div>`;
        }
    }

    // Busca o arquivo via API e exibe o código na tela
    async function handleFileRead(fileName) {
        output.innerHTML += `<div class="info">Lendo arquivo: ${fileName}...</div>`;
        try {
            const fileUrl = `https://github.com{REPO_OWNER}/${REPO_NAME}/contents/${DEFAULT_FOLDER}/${fileName}`;
            const response = await fetch(fileUrl);
            if (!response.ok) throw new Error('Arquivo não encontrado no repositório.');
            
            const fileData = await response.json();
            if (fileData.type === 'dir') {
                throw new Error(`'${fileName}' é um diretório. Indique um arquivo válido.`);
            }

            // Decodifica a resposta em Base64 tratando acentos e caracteres especiais nativos
            const decodedCode = decodeURIComponent(escape(atob(fileData.content)));
            
            output.innerHTML += `<div><span class="success">--- Exibindo: ${fileName} ---</span></div>`;
            output.innerHTML += `<pre class="code-box">${escapeHtml(decodedCode)}</pre>`;
        } catch (error) {
            output.innerHTML += `<div class="error">Erro: ${error.message}</div>`;
        }
    }

    // Atalho ao clicar no nome do arquivo listado
    window.executeRead = async function(name) {
        output.innerHTML += `<div><span class="prompt">angelo@poo-java:~$</span> read ${name}</div>`;
        await handleFileRead(name);
        output.scrollTop = output.scrollHeight;
    };

    // Atalho ao clicar em comandos de texto em links da tela
    window.executeCommandDirectly = async function(cmdText) {
        output.innerHTML += `<div><span class="prompt">angelo@poo-java:~$</span> ${cmdText}</div>`;
        await processCommand(cmdText);
        output.scrollTop = output.scrollHeight;
    };

    // Filtro para prevenir injeções que quebrem as tags HTML
    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
